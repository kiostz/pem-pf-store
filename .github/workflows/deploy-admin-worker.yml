# Deploys the Admin Worker to Cloudflare when its code or the admin page changes on main; a test job without secrets builds the admin page and gates a deploy job whose install runs no package scripts, so install scripts never hold the Cloudflare token.
name: Deploy Admin Worker # name shown in the Actions tab

on: # when the workflow runs
  push: # on a push
    branches: ['main'] # only the main branch
    paths: # only when one of these changes
      - 'workers/**' # Worker code, migrations and lockfile
      - 'src/**' # the admin page imports shared code from here
      - 'admin.html' # the admin page's HTML
      - 'vite.admin.config.ts' # the admin page's build
      - 'package.json' # root scripts and dependencies
      - 'tsconfig*.json' # the admin build runs tsc first
      - 'package-lock.json' # root lockfile
      - '.nvmrc' # the Node version
      - '.github/workflows/deploy-admin-worker.yml' # this file
  workflow_dispatch: # also from the Actions tab by hand; the deploy job still runs only on main

permissions: # every job token may only read the repository
  contents: read # read the repository

concurrency: # one Admin Worker deploy at a time; its own group, so a queued admin run never replaces a queued API run
  group: admin-worker # group name, not shared with the API Worker workflow
  cancel-in-progress: false # a running deploy finishes; only the newest queued run waits its turn

jobs: # the jobs of this workflow
  test: # build the admin page, typecheck and test; holds no secrets, so install scripts may run here
    runs-on: ubuntu-latest # runner image
    timeout-minutes: 15 # a hung test cannot hold the runner for hours
    steps: # run in order; a failure stops the workflow and the live Worker stays as it was
      - name: Checkout # fetch the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: # action inputs
          persist-credentials: false # do not leave the job token in .git/config
      - name: Set up Node # Node from .nvmrc with the npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: # action inputs
          node-version-file: .nvmrc # same Node as local
          cache: 'npm' # cache npm downloads
          cache-dependency-path: | # both lockfiles
            package-lock.json
            workers/package-lock.json
      - name: Install root dependencies # exact versions from the lockfile, for the admin page build
        run: npm ci # clean install
      - name: Build the admin page # Vite build into workers/admin/ui-dist, which the Worker bundles
        run: npm run build:admin # tsc then vite build with the admin config
      - name: Install Worker dependencies # exact versions from the lockfile, scripts allowed here because this job holds no secrets
        working-directory: workers # the Workers npm project
        run: npm ci # clean install
      - name: Typecheck # types
        working-directory: workers # the Workers npm project
        run: npm run typecheck # tsc on the Workers, tests and import
      - name: Test # Worker and import tests
        working-directory: workers # the Workers npm project
        run: npm test # vitest and the writer check
      - name: Upload the admin page # hand the built page to the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: # action inputs
          name: admin-ui-dist # artifact name the deploy job downloads
          path: workers/admin/ui-dist # the built page files
          if-no-files-found: error # an empty build must stop the workflow
          retention-days: 1 # only needed until the deploy job runs
  deploy: # publish the Admin Worker once the tests pass; the Access policy and secrets are the user's manual steps
    needs: test # runs only if build, typecheck and tests passed
    if: github.ref == 'refs/heads/main' # never from another branch, even by hand
    runs-on: ubuntu-latest # runner image
    timeout-minutes: 10 # a deploy is quick
    steps: # run in order
      - name: Check for the Cloudflare token # skip cleanly until the one-time setup has added it
        id: secrets # lets later steps read ready
        env: # secrets as env, never echoed
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # deploy token
        run: | # sets ready=true only when the token is present
          if [ -n "$TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Cloudflare token not set yet; Admin Worker deploy skipped."; fi
      - name: Checkout # fetch the code
        if: steps.secrets.outputs.ready == 'true' # only once set up
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: # action inputs
          persist-credentials: false # do not leave the job token in .git/config
      - name: Set up Node # Node from .nvmrc with the npm cache
        if: steps.secrets.outputs.ready == 'true' # only once set up
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: # action inputs
          node-version-file: .nvmrc # same Node as local
          cache: 'npm' # cache npm downloads
          cache-dependency-path: workers/package-lock.json # the Workers lockfile
      - name: Install dependencies without scripts # no package script runs in a job that holds the token
        if: steps.secrets.outputs.ready == 'true' # only once set up
        working-directory: workers # the Workers npm project
        run: npm ci --ignore-scripts # clean install, scripts off
      - name: Download the admin page # the page the test job built, so the deploy job builds nothing
        if: steps.secrets.outputs.ready == 'true' # only once set up
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: # action inputs
          name: admin-ui-dist # artifact name the test job uploaded
          path: workers/admin/ui-dist # where the Worker config imports it from
      - name: Deploy # publish the Admin Worker with the lockfile's wrangler
        if: steps.secrets.outputs.ready == 'true' # only once set up
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with: # action inputs
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }} # scoped to the one account, Workers deploy only
          workingDirectory: workers # where wrangler and the config live
          wranglerVersion: '4.151.1' # same wrangler as the lockfile, so the action uses the installed copy
          command: deploy --config admin/wrangler.jsonc # deploy the Admin Worker only
